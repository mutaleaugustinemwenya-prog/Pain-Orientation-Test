<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eight Laws of Pain</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050403; --void:#0a0806; --ash:#161209; --fog:#2a2314;
  --gold:#c9973a; --gold-d:#7a5a1a; --gold-dim:rgba(201,151,58,.12);
  --bone:#f0ead6; --ghost:#9a8f72; --danger:#8a2a1f;
  --accent:#c9973a; --accent-dim:rgba(201,151,58,.14); --accent-d:#7a5a1a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--black); color:var(--bone);
  font-family:'EB Garamond',Georgia,serif; font-size:18px; line-height:1.7;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;
}
.mono{font-family:'JetBrains Mono',monospace}
.eyebrow{font-family:'Cinzel',serif;font-size:.62rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--ghost)}
.display{font-family:'Cinzel',serif;font-weight:600;line-height:1.08}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer}

/* ---------- Ambient field ---------- */
#field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 40%, transparent 40%, rgba(0,0,0,.75) 100%);
}
.scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(to bottom, transparent 0 2px, #000 2px 4px);
  mix-blend-mode:overlay;
}
.ember{position:absolute;border-radius:50%;background:var(--accent);opacity:0;
  animation:float-ember linear infinite;filter:blur(.5px);
  box-shadow:0 0 6px var(--accent);
}
@keyframes float-ember{
  0%{opacity:0;transform:translateY(0) translateX(0)}
  10%{opacity:.55}
  90%{opacity:.35}
  100%{opacity:0;transform:translateY(-110vh) translateX(var(--drift,20px))}
}

#root{position:relative;z-index:5;min-height:100vh}

/* ---------- Layout shells ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 1.5rem 3rem;position:relative;animation:screenIn .6s ease both;}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:680px;width:100%;position:relative;z-index:2}
.wrap-wide{max-width:760px}

hr.rule{border:none;border-top:1px solid var(--fog);margin:1.8rem 0}

/* ---------- Buttons ---------- */
.btn{
  background:transparent;border:1px solid var(--accent);color:var(--bone);
  font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  padding:1rem 2.6rem;transition:background .3s,box-shadow .3s,transform .15s;
}
.btn:hover{background:var(--accent-dim);box-shadow:0 0 30px var(--accent-dim);transform:translateY(-1px)}
.btn:disabled{opacity:.25;pointer-events:none}
.btn-ghost{
  color:var(--ghost);font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.6rem 0;transition:color .2s;
}
.btn-ghost:hover{color:var(--bone)}

/* ---------- Boot ---------- */
#boot{align-items:flex-start;justify-content:center}
.boot-box{max-width:640px;width:100%}
.boot-line{font-size:.86rem;color:var(--ghost);margin-bottom:.4rem;white-space:pre-wrap}
.boot-line .ok{color:var(--accent)}
.boot-cursor{display:inline-block;width:8px;height:1em;background:var(--accent);vertical-align:-2px;
  animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.boot-bar-track{height:3px;background:var(--fog);width:100%;margin:1.6rem 0;position:relative;overflow:hidden}
.boot-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));width:0%;transition:width .25s linear}

/* ---------- Title ---------- */
#title{text-align:center}
.title-glow::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 35%, rgba(201,151,58,.10) 0%, transparent 72%);
}
.title-main{font-size:clamp(2.1rem,7vw,4.3rem);color:var(--bone);display:block}
.title-sub{font-size:clamp(2.1rem,7vw,4.3rem);color:var(--accent);font-style:italic;display:block;font-family:'EB Garamond',serif;font-weight:600}
.title-tag{color:var(--ghost);font-style:italic;margin:1rem 0 2.2rem;font-size:1.05rem}
.title-desc{color:var(--ghost);text-align:justify;hyphens:auto;margin-bottom:2.4rem;font-size:1rem}
.law-preview{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:2.6rem;opacity:.7}
.law-chip{border:1px solid var(--fog);padding:.4rem .8rem;font-size:.62rem;font-family:'Cinzel',serif;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ghost)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:50;
  background:linear-gradient(to bottom, rgba(5,4,3,.92), rgba(5,4,3,0));
  padding:.9rem 1.2rem .6rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.hud-act{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;color:var(--accent);white-space:nowrap}
.hud-dots{display:flex;gap:6px;flex:1;min-width:180px;justify-content:center}
.hud-dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--fog);display:flex;align-items:center;justify-content:center;
  font-size:.5rem;font-family:'Cinzel',serif;color:var(--ghost);transition:all .4s;position:relative;flex-shrink:0}
.hud-dot.done{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px var(--accent-dim)}
.hud-dot.current{border-color:var(--bone);color:var(--bone);animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 rgba(240,234,214,0)}50%{box-shadow:0 0 12px rgba(240,234,214,.5)}}
.hud-meter{display:flex;align-items:center;gap:.5rem;min-width:120px}
.hud-meter-track{width:90px;height:3px;background:var(--fog)}
.hud-meter-fill{height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));transition:width .8s ease}
.hud-mute{font-size:.85rem;color:var(--ghost);border:1px solid var(--fog);width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hud-mute:hover{color:var(--bone);border-color:var(--ghost)}

/* ---------- Act intro ---------- */
#act-intro{text-align:center}
.act-roman{font-family:'Cinzel',serif;font-size:5.5rem;color:var(--accent-d);opacity:.5;line-height:1;margin-bottom:.4rem}
.act-name{font-family:'Cinzel',serif;font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:.08em;color:var(--bone);margin-bottom:1rem}
.act-tag{color:var(--ghost);font-style:italic;margin-bottom:2.4rem;font-size:1.05rem}
.act-laws{display:flex;justify-content:center;gap:2.2rem;margin-bottom:2.6rem;flex-wrap:wrap}
.act-law-item{text-align:center;opacity:.85}
.act-law-num{font-family:'Cinzel',serif;font-size:.6rem;color:var(--ghost);letter-spacing:.2em}
.act-law-name{font-family:'Cinzel',serif;font-size:.82rem;color:var(--bone);margin-top:.3rem;letter-spacing:.04em}

/* ---------- Portal scene ---------- */
#portal{padding-top:7rem;align-items:center}
.portal-frame{position:relative;width:150px;height:150px;margin:0 auto 1.6rem;display:flex;align-items:center;justify-content:center}
.portal-ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent-d);opacity:.55}
.portal-ring.r2{inset:12px;animation:spinSlow 22s linear infinite}
.portal-ring.r3{inset:24px;animation:spinSlow 16s linear infinite reverse;opacity:.35}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.portal-core{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle, var(--accent-dim), transparent 70%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px var(--accent-dim), inset 0 0 30px rgba(0,0,0,.6);
  animation:corePulse 3.4s ease-in-out infinite;
}
@keyframes corePulse{0%,100%{box-shadow:0 0 30px var(--accent-dim), inset 0 0 24px rgba(0,0,0,.6)}50%{box-shadow:0 0 52px var(--accent-dim), inset 0 0 30px rgba(0,0,0,.6)}}
.portal-num{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.3em;text-align:center;color:var(--accent);margin-bottom:.3rem}
.portal-title{font-family:'Cinzel',serif;font-size:clamp(1.5rem,4.4vw,2.15rem);text-align:center;color:var(--bone);margin-bottom:.3rem}
.portal-sub{text-align:center;color:var(--ghost);font-style:italic;margin-bottom:2rem;font-size:.98rem}

.typewriter-box{min-height:5.4rem;margin-bottom:1.6rem}
.tw-line{font-size:1.04rem;line-height:1.85;color:var(--bone);text-align:justify;hyphens:auto;margin-bottom:.9rem}
.tw-cursor{display:inline-block;width:9px;height:1em;background:var(--accent);vertical-align:-3px;animation:blink .9s step-end infinite}
.skip-hint{text-align:center;color:var(--ghost);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  opacity:.55;margin-bottom:1.4rem;cursor:pointer}
.skip-hint:hover{opacity:.9}

.rune-callout{border-left:2px solid var(--accent-d);padding:1rem 1.4rem;background:var(--accent-dim);margin:1.6rem 0 2rem}
.rune-callout .eyebrow{color:var(--accent);margin-bottom:.5rem}
.rune-callout p{font-style:italic;color:var(--ghost);font-size:.94rem;line-height:1.75}

/* ---------- Trial (question) ---------- */
.trial-box{margin-top:.6rem;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.trial-label{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ghost);margin-bottom:.7rem}
.trial-q{font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.45;color:var(--bone);margin-bottom:.5rem}
.trial-sub{font-style:italic;color:var(--ghost);font-size:.9rem;margin-bottom:1.6rem}
.opt{
  display:flex;align-items:flex-start;gap:1rem;width:100%;text-align:left;
  background:var(--ash);border:1px solid var(--fog);color:var(--bone);
  font-size:.98rem;line-height:1.55;padding:.9rem 1.2rem;margin-bottom:.55rem;
  transition:border-color .2s,background .2s,transform .15s;opacity:0;animation:optIn .45s ease both;
}
@keyframes optIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.opt:hover{border-color:var(--accent);transform:translateX(4px)}
.opt.chosen{border-color:var(--accent);background:var(--accent-dim)}
.opt-l{font-family:'Cinzel',serif;font-size:.56rem;font-weight:600;color:var(--ghost);flex-shrink:0;padding-top:.28rem;min-width:1rem}
.opt.chosen .opt-l{color:var(--accent)}

/* ---------- Rune collect / portal close ---------- */
.rune-collect-wrap{text-align:center;margin-top:1.8rem}
.rune-word{font-family:'Cinzel',serif;font-size:1.6rem;letter-spacing:.16em;color:var(--accent);
  animation:runeReveal .8s ease both;text-shadow:0 0 22px var(--accent-dim)}
@keyframes runeReveal{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.16em}}
.rune-caption{color:var(--ghost);font-style:italic;font-size:.88rem;margin-top:.6rem}

/* ---------- Calculating / results ---------- */
#calc{text-align:center;gap:1.6rem}
.spinner{width:56px;height:56px;border:1px solid var(--fog);border-top-color:var(--accent);border-radius:50%;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc-msg{font-style:italic;color:var(--ghost);min-height:1.6em}

#results{padding-top:6rem}
.r-hero{display:flex;align-items:center;gap:1.8rem;flex-wrap:wrap;margin-bottom:1.2rem}
.r-symbol{flex-shrink:0;animation:reveal .7s ease both,glow 3.5s ease-in-out .7s infinite}
@keyframes reveal{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px rgba(201,151,58,.3))}50%{filter:drop-shadow(0 0 16px rgba(201,151,58,.7))}}
.r-name{font-family:'Cinzel',serif;font-size:clamp(1.7rem,5vw,2.9rem);font-style:italic;color:var(--gold);line-height:1}
.r-tagline{font-style:italic;color:var(--ghost);margin-top:.3rem}
.pledge-box{border:1px solid var(--fog);padding:1.6rem;margin:1.8rem 0;background:rgba(201,151,58,.03)}
.pledge-runes{display:flex;flex-wrap:wrap;gap:.5rem .7rem;margin-bottom:1rem}
.pledge-rune{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.12em;color:var(--accent);
  border:1px solid var(--accent-d);padding:.3rem .6rem}
.pledge-text{font-style:italic;color:var(--bone);line-height:1.9;font-size:1.02rem}
.score-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--fog);border:1px solid var(--fog);margin:1.8rem 0}
.score-cell{background:var(--ash);padding:1rem 1.2rem}
.score-val{font-family:'Cinzel',serif;font-size:1.5rem;color:var(--accent)}
.r-desc{color:var(--bone);text-align:justify;hyphens:auto;line-height:1.85;margin-bottom:.4rem}
.law-bars{margin-top:1.2rem}
.law-row{display:flex;align-items:center;gap:1rem;margin-bottom:.85rem}
.law-name{font-size:.8rem;color:var(--ghost);width:150px;flex-shrink:0}
.bar-track{flex:1;height:1px;background:var(--fog);position:relative}
.bar-fill{position:absolute;left:0;top:-1.5px;bottom:-1.5px;background:linear-gradient(90deg,var(--gold-d),var(--gold));width:0%;transition:width 1.2s ease}
.bar-score{font-size:.7rem;color:var(--ghost);width:2.6rem;text-align:right}
.growth{border-left:2px solid var(--gold-d);padding:1.1rem 1.5rem;background:rgba(201,151,58,.04);margin:1.8rem 0 2.2rem}
.growth-text{font-style:italic;color:var(--ghost);font-size:.94rem;line-height:1.75}
.result-actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}

@media(max-width:560px){
  .score-strip{grid-template-columns:1fr 1fr}
  .law-name{width:106px;font-size:.72rem}
  .hud-dots{order:3;flex-basis:100%}
}
</style>
</head>
<body>
<div id="field"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   SOUND — tiny WebAudio chime engine, no external assets
   ============================================================ */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function chime(freqs, dur, muted){
  if(muted) return;
  const ctx = getCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  freqs.forEach((f, i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.02 + i*0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur + i*0.03);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now + i*0.03);
    osc.stop(now + dur + i*0.03 + 0.05);
  });
}
const SFX = {
  boot: (m)=>chime([220], 0.4, m),
  advance: (m)=>chime([330, 440], 0.5, m),
  select: (m)=>chime([392], 0.25, m),
  rune: (m)=>chime([523.25, 659.25, 783.99], 1.1, m),
  act: (m)=>chime([196, 246.94, 293.66], 1.4, m),
  finale: (m)=>chime([261.63, 329.63, 392, 523.25], 2, m),
};

/* ============================================================
   EMBER FIELD — ambient particles, mounted once
   ============================================================ */
function EmberField({ accent }){
  useEffect(()=>{
    const field = document.getElementById('field');
    field.style.setProperty('--accent', accent);
    field.innerHTML = '';
    const n = window.innerWidth < 640 ? 14 : 26;
    for(let i=0;i<n;i++){
      const d = document.createElement('div');
      d.className = 'ember';
      const size = 1 + Math.random()*2.4;
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.style.left = Math.random()*100+'%';
      d.style.bottom = '-10px';
      d.style.setProperty('--drift', (Math.random()*60-30)+'px');
      const dur = 10 + Math.random()*14;
      d.style.animationDuration = dur+'s';
      d.style.animationDelay = (Math.random()*dur)+'s';
      field.appendChild(d);
    }
  }, [accent]);
  return null;
}

/* ============================================================
   TYPEWRITER — reveals text progressively, click-to-skip
   ============================================================ */
function Typewriter({ lines, speed = 16, onDone, startDelay = 0 }){
  const [visibleLines, setVisibleLines] = useState([]);
  const [charIdx, setCharIdx] = useState(0);
  const [lineIdx, setLineIdx] = useState(0);
  const [done, setDone] = useState(false);
  const timeoutRef = useRef(null);
  const skippedRef = useRef(false);

  useEffect(()=>{
    setVisibleLines([]); setCharIdx(0); setLineIdx(0); setDone(false); skippedRef.current = false;
  }, [lines]);

  useEffect(()=>{
    if(done) return;
    if(lineIdx >= lines.length){
      setDone(true);
      if(onDone) onDone();
      return;
    }
    const current = lines[lineIdx];
    if(charIdx === 0 && startDelay > 0 && lineIdx === 0){
      timeoutRef.current = setTimeout(()=>{ tick(current); }, startDelay);
      return () => clearTimeout(timeoutRef.current);
    }
    timeoutRef.current = setTimeout(()=>{ tick(current); }, speed);
    return () => clearTimeout(timeoutRef.current);
    function tick(currentLine){
      if(charIdx < currentLine.length){
        setCharIdx(c => c + 1);
      } else {
        setVisibleLines(v => [...v, currentLine]);
        setLineIdx(i => i + 1);
        setCharIdx(0);
      }
    }
  }, [charIdx, lineIdx, done]);

  function skip(){
    if(done || skippedRef.current) return;
    skippedRef.current = true;
    clearTimeout(timeoutRef.current);
    setVisibleLines(lines);
    setLineIdx(lines.length);
    setCharIdx(0);
    setDone(true);
    if(onDone) onDone();
  }

  const inProgress = lineIdx < lines.length ? lines[lineIdx].slice(0, charIdx) : '';

  return (
    <div className="typewriter-box" onClick={skip}>
      {visibleLines.map((l, i) => <p className="tw-line" key={i}>{l}</p>)}
      {!done && lineIdx < lines.length && (
        <p className="tw-line">{inProgress}<span className="tw-cursor"></span></p>
      )}
      {!done && <div className="skip-hint">tap to reveal</div>}
    </div>
  );
}

/* ============================================================
   DATA — the eight laws, in three-act order
   (questions & scoring mirror The Pain Orientation Test)
   ============================================================ */
const LAWS = [
  {
    id:"malevolence", numeral:"I", act:1,
    name:"The Law of Malevolence",
    tagline:"There is a currency of harm, and you have already spent some of it.",
    accent:"#b4432e",
    glyph:"mask",
    rune:"ADMIT",
    runeLine:"To admit the capacity for harm is not confession for punishment. It is the precondition for responsibility.",
    teaching:[
      "The first portal does not ask what has been done to you. It asks what lives in you, undone, unused, or already spent.",
      "Every psyche carries the same currency: the capacity to wound, to dominate, to look away while someone else pays the cost. You did not choose to be built this way. You are, however, responsible for what you do with it.",
      "This is not an accusation. It is an inventory. What you can name, you can no longer be ambushed by."
    ],
    q:{
      text:"When life delivers deliberate-seeming cruelty — illness arriving at the worst moment, loss appearing without invitation — what is your most honest first response?",
      sub:"Consider your instinctive reaction, not the response you wish you had.",
      options:[
        {l:"A",text:"I feel betrayed. The universe owes me better than this.",score:1},
        {l:"B",text:"I withdraw quickly. Non-engagement is the surest form of protection.",score:2},
        {l:"C",text:"I grow angry and push through regardless. Rage is, at minimum, motion.",score:3},
        {l:"D",text:"I search for meaning within it, even when meaning does not readily appear.",score:4},
        {l:"E",text:"I hold it without requiring resolution. Cruelty is real and I remain present.",score:5}
      ]
    }
  },
  {
    id:"vulnerability", numeral:"II", act:1,
    name:"The Law of Vulnerability",
    tagline:"The crack is not the damage. It is the design.",
    accent:"#6a4d9c",
    glyph:"crack",
    rune:"EXPOSE",
    runeLine:"What you can name, you can no longer be ambushed by — but what you refuse to show, you cannot ever mend. Kintsugi does not hide the break. It gilds it.",
    teaching:[
      "Somewhere behind this door is the place you have been most careful to guard: not because it is shameful, but because it is tender.",
      "Armor feels like protection. It has a price all the same — the things unsaid, untried, unbecome, because being guarded felt safer than being seen.",
      "The gold in kintsugi is never hidden. It is the break, repaired, made the most beautiful part of the vessel. Your confidence is on the other side of what you have been hiding."

function getArchetype(total){
  return ARCHETYPES.find(a => total >= a.range[0] && total <= a.range[1]) || ARCHETYPES[2];
}

function archetypeSvg(id, size){
  const g="#c9973a", gd="#7a5a1a", b="#f0ead6", a="#1a1608", gh="#9a8f72", bk="#080705";
  const c = size/2, r = size*0.46;
  const bg = <circle cx={c} cy={c} r={r} fill={a} stroke={gd} strokeWidth="0.8"/>;
  if(id==="avoider") return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {bg}
    <line x1={c-size*.30} y1={c-size*.10} x2={c+size*.22} y2={c-size*.10} stroke={g} strokeWidth="1.4" strokeLinecap="round"/>
    <line x1={c-size*.36} y1={c} x2={c+size*.28} y2={c} stroke={g} strokeWidth="1.8" strokeLinecap="round"/>
    <line x1={c-size*.30} y1={c+size*.10} x2={c+size*.22} y2={c+size*.10} stroke={g} strokeWidth="1.4" strokeLinecap="round"/>
    <polygon points={`${c+size*.34},${c} ${c+size*.22},${c-size*.08} ${c+size*.22},${c+size*.08}`} fill={g}/>
    <path d={`M${c-size*.04} ${c+size*.22} A${size*.23} ${size*.23} 0 1 1 ${c-size*.04} ${c-size*.22}`} fill="none" stroke={gh} strokeWidth="1.3" strokeLinecap="round"/>
  </svg>;
  if(id==="resister") return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {bg}
    <path d={`M${c} ${c-size*.30} L${c-size*.22} ${c-size*.14} L${c-size*.22} ${c+size*.08} Q${c-size*.22} ${c+size*.30} ${c} ${c+size*.32} Q${c+size*.22} ${c+size*.30} ${c+size*.22} ${c+size*.08} L${c+size*.22} ${c-size*.14} Z`} fill="#1e1408" stroke={g} strokeWidth="1.6"/>
    <line x1={c} y1={c-size*.22} x2={c} y2={c+size*.24} stroke={g} strokeWidth="1.5" strokeLinecap="round"/>
    <line x1={c-size*.17} y1={c+size*.01} x2={c+size*.17} y2={c+size*.01} stroke={g} strokeWidth="1.5" strokeLinecap="round"/>
  </svg>;
  if(id==="negotiator") return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {bg}
    <line x1={c} y1={c-size*.30} x2={c} y2={c+size*.32} stroke={g} strokeWidth="1.4" strokeLinecap="round"/>
    <line x1={c-size*.28} y1={c-size*.05} x2={c+size*.28} y2={c-size*.05} stroke={g} strokeWidth="1.4" strokeLinecap="round"/>
    <polygon points={`${c},${c+size*.30} ${c-size*.07},${c+size*.38} ${c+size*.07},${c+size*.38}`} fill={g}/>
  </svg>;
  if(id==="witness") return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {bg}
    <path d={`M${c-size*.34} ${c} Q${c} ${c-size*.22} ${c+size*.34} ${c} Q${c} ${c+size*.22} ${c-size*.34} ${c} Z`} fill="#14100a" stroke={b} strokeWidth="1.4"/>
    <circle cx={c} cy={c} r={size*.13} fill="#1e1408" stroke={g} strokeWidth="1.2"/>
    <circle cx={c} cy={c} r={size*.07} fill={bk}/>
  </svg>;
  // integrator
  let dots=[], sPts=[];
  for(let i=0;i<8;i++){ const a2=(i*45*Math.PI)/180; dots.push(<circle key={i} cx={(c+size*.22*Math.cos(a2)).toFixed(1)} cy={(c+size*.22*Math.sin(a2)).toFixed(1)} r={size*.09} fill={a} stroke={g} strokeWidth="0.9"/>); }
  for(let i=0;i<16;i++){ const a2=((i*22.5-90)*Math.PI)/180, r2 = i%2===0?size*.16:size*.08; sPts.push(`${(c+r2*Math.cos(a2)).toFixed(1)},${(c+r2*Math.sin(a2)).toFixed(1)}`); }
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    {bg}
    <circle cx={c} cy={c} r={size*.43} fill="none" stroke={gd} strokeWidth="0.5"/>
    {dots}
    <polygon points={sPts.join(' ')} fill={g} stroke={bk} strokeWidth="0.4"/>
    <circle cx={c} cy={c} r={size*.04} fill={b}/>
  </svg>;
}

/* ============================================================

   ============================================================ */
function HUD({ portalIndex, runes, act, muted, setMuted }){
  const pct = Math.min(100, Math.round((runes.length/8)*100));
  return (
    <div id="hud">
      <div className="hud-act mono">ACT {act?.roman || ''} · {act?.name || ''}</div>
      <div className="hud-dots">
        {LAWS.map((law, i)=>{
          const isDone = runes.includes(law.id);
          const isCurrent = i === portalIndex;
          return <div key={law.id} className={"hud-dot" + (isDone?" done":"") + (isCurrent?" current":"")} title={law.name}>
            {isDone ? "✓" : law.numeral}
          </div>;
        })}
      </div>
      <div className="hud-meter">
        <span className="eyebrow" style={{fontSize:'.55rem'}}>Orientation</span>
        <div className="hud-meter-track"><div className="hud-meter-fill" style={{width:pct+'%'}}></div></div>
      </div>
      <button className="hud-mute" onClick={()=>setMuted(m=>!m)} title={muted ? "Unmute" : "Mute"}>
        {muted ? "🔇" : "🔊"}
      </button>
    </div>
  );
}

function BootScreen({ onDone, muted }){
  const bootLines = useMemo(()=>[
    "PAIN OS v8.0.1 — initializing reorientation protocol...",
    "loading law modules ................ [8/8] OK",
    "loading pain orientation index ...... OK",
    "calibrating discernment threshold ... OK",
    "the eight portals are ready.",
  ], []);
  const [shown, setShown] = useState(0);
  const [pct, setPct] = useState(0);
  useEffect(()=>{
    SFX.boot(muted);
    const iv = setInterval(()=>{
      setShown(s=>{
        if(s < bootLines.length){ return s+1; }
        clearInterval(iv);
        return s;
      });
    }, 420);
    return ()=>clearInterval(iv);
  }, []);
  useEffect(()=>{
    const iv = setInterval(()=> setPct(p => Math.min(100, p + 4)), 60);
    return ()=>clearInterval(iv);
  }, []);
  return (
    <div className="screen" id="boot">
      <div className="boot-box mono">
        {bootLines.slice(0, shown).map((l,i)=>(
          <div className="boot-line" key={i}>
            {l}{i === bootLines.length-1 && <span className="ok"> ✓</span>}
          </div>
        ))}
        <div className="boot-bar-track"><div className="boot-bar-fill" style={{width:pct+'%'}}></div></div>
        {shown >= bootLines.length && (
          <button className="btn" onClick={onDone} style={{marginTop:'1.4rem'}}>Enter</button>
        )}
        {shown < bootLines.length && <span className="boot-cursor"></span>}
      </div>
    </div>
  );
}

      <div className="wrap">
        <div className="act-roman">{act.roman}</div>
        <div className="act-name">{act.name}</div>
        <p className="act-tag">"{act.tag}"</p>
        <div className="act-laws">
          {lawsInAct.map(l=>(
            <div className="act-law-item" key={l.id}>
              <div className="act-law-num">LAW {l.numeral}</div>
              <div className="act-law-name">{l.name.replace('The Law of ','')}</div>
            </div>
          ))}
        </div>
        <button className="btn" onClick={onDone}>Enter Act {act.roman}</button>
      </div>
    </div>
  );
}

function PortalScene({ law, index, onComplete, muted }){
  const [phase, setPhase] = useState('teaching'); // teaching -> trial -> rune
  const [chosen, setChosen] = useState(null);
  const [optionsShown, setOptionsShown] = useState(false);

  useEffect(()=>{
    setPhase('teaching'); setChosen(null); setOptionsShown(false);
    const root = document.documentElement;
    root.style.setProperty('--accent', law.accent);
  }, [law]);

  function handleTeachingDone(){
    setTimeout(()=>{ setPhase('trial'); setTimeout(()=>setOptionsShown(true), 250); }, 350);
  }

  function selectOption(opt){
    if(chosen) return;
    setChosen(opt);
    SFX.select(muted);
    setTimeout(()=>{
      setPhase('rune');
      SFX.rune(muted);
    }, 650);
  }

  return (
    <div className="screen" id="portal" style={{'--accent': law.accent}}>
      <div className="wrap">
        <div className="portal-frame">
          <div className="portal-ring r3"></div>
          <div className="portal-ring r2"></div>
          <div className="portal-ring"></div>
          <div className="portal-core">
            <PortalGlyph type={law.glyph} color={law.accent} />
          </div>
        </div>
        <div className="portal-num mono">PORTAL {law.numeral} OF VIII</div>
        <h2 className="portal-title">{law.name}</h2>
        <p className="portal-sub">"{law.tagline}"</p>

        {phase === 'teaching' && (
          <Typewriter lines={law.teaching} onDone={handleTeachingDone} muted={muted} speed={14} />
        )}

        {phase !== 'teaching' && (
          <div className="trial-box">
            <p className="trial-label">The Trial</p>
            <p className="trial-q">{law.q.text}</p>
            <p className="trial-sub">{law.q.sub}</p>
            {optionsShown && (
              <div>
                {law.q.options.map((o, i)=>(
                  <button
                    key={o.l}
                    className={"opt" + (chosen && chosen.l===o.l ? " chosen":"")}
                    style={{animationDelay:(i*0.08)+'s'}}
                    onClick={()=>selectOption(o)}
                    disabled={!!chosen}
                  >
                    <span className="opt-l">{o.l}</span><span>{o.text}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

        {phase === 'rune' && (
          <div className="rune-collect-wrap">
            <hr className="rule" />
            <div className="rune-word">{law.rune}</div>
            <p className="rune-caption">{law.runeLine}</p>
            <div className="rune-callout">
              <p className="eyebrow">Rune Claimed</p>
              <p>You carry this word forward. It will complete your pledge at the final threshold.</p>
            </div>
            <button className="btn" onClick={()=>onComplete(chosen.score)}>
              {index === 7 ? "Face the Final Threshold →" : "Pass Through the Portal →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function CalculatingScreen({ onDone }){
  const msgs = [
    "Weighing your responses across all eight laws…",
    "Binding your eight collected runes into a pledge…",
    "Locating your archetype within the spectrum…",
  ];
  const [i, setI] = useState(0);
  useEffect(()=>{
    const iv = setInterval(()=> setI(v => Math.min(msgs.length-1, v+1)), 1100);
    const t = setTimeout(onDone, 3400);
    return ()=>{ clearInterval(iv); clearTimeout(t); };
  }, []);
  return (
    <div className="screen" id="calc">
      <div className="spinner"></div>
      <p className="eyebrow">Compiling your orientation</p>
      <p className="calc-msg">{msgs[i]}</p>
    </div>
  );
}

function ResultsScreen({ answers, runes, onRestart, muted }){
  const total = answers.reduce((s,a)=>s+a, 0);
  const arch = getArchetype(total);

  useEffect(()=>{
    SFX.finale(muted);
    requestAnimationFrame(()=> setTimeout(()=>{
      document.querySelectorAll('.bar-fill').forEach(el=>{ el.style.width = el.dataset.pct; });
    }, 300));
  }, []);

  const pledgeLines = {
    ADMIT:"admit what moves in me",
    EXPOSE:"expose what I have hidden",
    ENOUGH:"call enough what already is",
    TEND:"tend what decays",
    RIDE:"ride what impulse brings",
    DISCERN:"discern before I cross",
    SEE:"see before I suffer",
    GROUND:"stand grounded in what ends",
  };
  const pledgeSentence = "I will " + runes.map(r=>pledgeLines[r]).join(", ").replace(/, ([^,]*)$/, ", and $1") + ".";

  return (
    <div className="screen" id="results">
      <div className="wrap wrap-wide">
        <p className="eyebrow" style={{marginBottom:'1.2rem'}}>The Final Threshold — You Have Been Reoriented</p>

        <div className="r-hero">
          <div className="r-symbol">{archetypeSvg(arch.id, 96)}</div>
          <div>
            <h2 className="r-name">{arch.name}</h2>
            <p className="r-tagline">"{arch.tagline}"</p>
          </div>
        </div>

        <div className="pledge-box">
          <p className="eyebrow" style={{marginBottom:'.8rem'}}>Your Reorientation Pledge</p>
          <div className="pledge-runes">
            {runes.map(r => <span className="pledge-rune mono" key={r}>{r}</span>)}
          </div>
          <p className="pledge-text">{pledgeSentence}</p>
        </div>

        <div className="score-strip">
          <div className="score-cell"><p className="eyebrow">Total Score</p><p className="score-val">{total} / 40</p></div>
          <div className="score-cell"><p className="eyebrow">Orientation</p><p className="score-val" style={{fontSize:'1.1rem'}}>{arch.orient}</p></div>
          <div className="score-cell"><p className="eyebrow">Score Range</p><p className="score-val" style={{fontSize:'1.1rem'}}>{arch.range[0]}–{arch.range[1]}</p></div>
        </div>

        <p className="r-desc">{arch.desc}</p>

        <hr className="rule" />
        <p className="eyebrow" style={{marginBottom:'1.2rem'}}>Score by Law of Pain</p>
        <div className="law-bars">
          {LAWS.map((law, i)=>(
            <div className="law-row" key={law.id}>
              <div className="law-name">{law.name.replace('The Law of ','')}</div>
              <div className="bar-track"><div className="bar-fill" data-pct={(answers[i]/5)*100+'%'} style={{width:'0%'}}></div></div>
              <div className="bar-score">{answers[i]} / 5</div>
            </div>
          ))}
        </div>

        <div className="growth">
          <p className="eyebrow" style={{color:'var(--gold)', marginBottom:'.5rem'}}>Growth Practice</p>
          <p className="growth-text">{arch.growth}</p>
        </div>

        <div className="result-actions">
          <button className="btn" onClick={onRestart}>Walk the Portals Again</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP — state machine
   ============================================================ */
function App(){
  const [stage, setStage] = useState('boot'); // boot -> title -> actintro -> portal -> calc -> results
  const [portalIndex, setPortalIndex] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [runes, setRunes] = useState([]);
  const [muted, setMuted] = useState(false);
  const [pendingAct, setPendingAct] = useState(ACTS[0]);

  const currentLaw = LAWS[portalIndex];

  function startTitle(){ setStage('title'); }
  function startJourney(){
    setPortalIndex(0); setAnswers([]); setRunes([]);
    setPendingAct(ACTS[0]);
    setStage('actintro');
  }

  function completePortal(score){
    const newAnswers = [...answers, score];
    const newRunes = [...runes, currentLaw.rune];
    setAnswers(newAnswers);
    setRunes(newRunes);

    const nextIndex = portalIndex + 1;
    if(nextIndex >= LAWS.length){
      setStage('calc');
      return;
    }
    const nextLaw = LAWS[nextIndex];
    setPortalIndex(nextIndex);
    if(nextLaw.act !== currentLaw.act){
      setPendingAct(ACTS[nextLaw.act - 1]);
      setStage('actintro');
    }
  }

  function goToPortalAfterAct(){ setStage('portal'); }

  function finishCalc(){ setStage('results'); }

  function restart(){
    setStage('title');
    setPortalIndex(0); setAnswers([]); setRunes([]);
  }

  const accentForStage = stage === 'portal' ? currentLaw.accent : (stage === 'actintro' ? '#c9973a' : '#c9973a');

  return (
    <React.Fragment>
      <EmberField accent={accentForStage} />
      {stage !== 'boot' && stage !== 'title' && (
        <HUD portalIndex={portalIndex} runes={runes} act={LAWS[Math.min(portalIndex, 7)] ? ACTS[LAWS[Math.min(portalIndex,7)].act-1] : ACTS[0]} muted={muted} setMuted={setMuted} />
      )}
      {stage === 'boot' && <BootScreen onDone={startTitle} muted={muted} />}
      {stage === 'title' && <TitleScreen onStart={startJourney} />}
      {stage === 'actintro' && (
        <ActIntroScreen act={pendingAct} onDone={goToPortalAfterAct} muted={muted} />
      )}
      {stage === 'portal' && (
        <PortalScene law={currentLaw} index={portalIndex} onComplete={completePortal} muted={muted} />
      )}
      {stage === 'calc' && <CalculatingScreen onDone={finishCalc} />}
      {stage === 'results' && (
        <ResultsScreen answers={answers} runes={runes} onRestart={restart} muted={muted} />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
